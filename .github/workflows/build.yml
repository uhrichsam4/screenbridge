name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mac:
    name: macOS (arm64 dmg)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Native libraries and esbuild
        run: brew install x264 opus pkgconf esbuild
      # Same Rust as voxl's own CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            voxl/target
          key: cargo-${{ runner.os }}-${{ hashFiles('voxl/Cargo.lock', 'patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Apply voxl patches
        run: bash scripts/apply-voxl-patches.sh
      - name: Build voxl
        working-directory: voxl
        run: cargo build --release --locked
      - name: Bundle voxl and its libraries
        run: bash scripts/prepare-voxl-mac.sh voxl/target/release/voxl
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run dist:mac -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: screenbridge-mac
          path: dist/*.dmg
          if-no-files-found: error

  windows:
    name: Windows (x64 installer)
    runs-on: windows-latest
    env:
      # Static x264, libyuv and Opus (with the DLL C runtime, as Rust uses), so voxl.exe
      # runs on its own. Same recipe as voxl's own CI.
      VCPKGRS_TRIPLET: x64-windows-static-md
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\vcpkg-cache,readwrite
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # Same Rust as voxl's own CI.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.93.0'
      - uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-x264-libyuv-opus-v1
      - name: Native libraries (vcpkg) and esbuild
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force vcpkg-cache | Out-Null
          vcpkg install x264 libyuv opus --triplet $env:VCPKGRS_TRIPLET
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          npm install -g esbuild
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            voxl/target
          key: cargo-${{ runner.os }}-${{ hashFiles('voxl/Cargo.lock', 'patches/*.patch') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Apply voxl patches
        shell: bash
        run: bash scripts/apply-voxl-patches.sh
      - name: Build voxl
        working-directory: voxl
        run: cargo build --release --locked
      - name: Bundle voxl.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force resources\bin | Out-Null
          Copy-Item voxl\target\release\voxl.exe resources\bin\voxl.exe
          & resources\bin\voxl.exe --help > $null
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: screenbridge-windows
          path: dist/*.exe
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l artifacts
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ScreenBridge $GITHUB_REF_NAME" \
            --generate-notes
